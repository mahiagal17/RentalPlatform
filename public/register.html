<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | RentLens Camera Rental Platform</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 3rem 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 1.85rem;
      margin-bottom: 0.5rem;
    }
    .auth-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
      transition: all var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }
    .help-text {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }
    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="container">
      <div class="nav-content"></div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Join RentLens</h1>
        <p class="auth-desc">One account to rent out gear and book from others</p>
      </div>

      <div id="errorBanner" class="error-banner"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="e.g. Vikram Seth" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="e.g. vikram@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">Mobile Phone</label>
            <input 
              type="tel" 
              id="phone" 
              class="form-input" 
              placeholder="e.g. 9876543210" 
              required 
              autocomplete="tel"
            >
            <div class="help-text">10-digit mobile number</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="city">City</label>
            <input 
              type="text" 
              id="city" 
              class="form-input" 
              placeholder="e.g. Mumbai" 
              required 
              autocomplete="address-level2"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Min. 8 characters" 
              required 
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-input" 
              placeholder="Repeat password" 
              required 
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
            >
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
          <span>Create Account</span>
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Log in</a>
      </p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    if (Auth.isAuthenticated()) {
      window.location.href = '/';
    }

    const form = document.getElementById('registerForm');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function hideError() {
      errorBanner.style.display = 'none';
      errorBanner.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const city = document.getElementById('city').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Client-side validations
      if (password !== confirmPassword) {
        showError("Passwords do not match. Please re-enter.");
        return;
      }

      if (password.length < 8) {
        showError("Password must be at least 8 characters long.");
        return;
      }

      const phoneClean = phone.replace(/[\s\-\(\)]/g, '');
      if (phoneClean.length < 10) {
        showError("Please enter a valid 10-digit mobile number.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Creating account...</span>`;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone: phoneClean, city, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Registration failed.');
        }

        // Store session
        Auth.setToken(data.token);
        Auth.setUser(data.user);

        showToast('Registration successful! Welcome to RentLens, ' + data.user.name, 'success');

        setTimeout(() => {
          window.location.href = '/';
        }, 500);

      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Create Account</span>`;
      }
    });
  </script>
</body>
</html>
